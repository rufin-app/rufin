name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Dependency updates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          # rufinbot's noreply address, which GitHub verifies its SSH signing key against.
          RENOVATE_GIT_AUTHOR: rufinbot <358772947+rufinbot@users.noreply.github.com>
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.RENOVATE_SIGNING_KEY }}
        with:
          configurationFile: .github/renovate-global.js
          token: ${{ secrets.RENOVATE_TOKEN }}
